# Fictional fishery quota ledger demo - local infrastructure ONLY.
# Not connected to any regulatory system; not a real fishing permit.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quota_ledger
      POSTGRES_USER: quota
      POSTGRES_PASSWORD: quota
    ports:
      - "5432:5432"
    volumes:
      - quota_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quota -d quota_ledger"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  quota_pgdata:
