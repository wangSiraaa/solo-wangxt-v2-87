version: "3.9"

# PostgreSQL quota ledger for local runs.
# Demo data only — fictional species and permit rules; not a real fishing permit.
services:
  postgres:
    image: postgres:16-alpine
    container_name: quota-ledger-db
    environment:
      POSTGRES_DB: quota_ledger
      POSTGRES_USER: quota
      POSTGRES_PASSWORD: quota
    ports:
      - "5432:5432"
    volumes:
      - quota-ledger-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quota -d quota_ledger"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  quota-ledger-data:
